name: Quality

on:
  push:
  pull_request:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - run: php -l wizjo-monitor.php
      - run: php -l uninstall.php
      - run: php tests/run.php
      - name: Build WordPress.org package
        run: |
          mkdir -p build/wizjo-monitor
          cp wizjo-monitor.php readme.txt uninstall.php build/wizjo-monitor/
      - uses: wordpress/plugin-check-action@v1
        with:
          slug: wizjo-monitor
          build-dir: ./build/wizjo-monitor
